<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self' http://127.0.0.1:8765 https:;"
    >
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>SIOUX CSP Checkout Sandbox</title>
    <style>
      body {
        margin: 0;
        font-family: "Segoe UI", Arial, sans-serif;
        background: linear-gradient(135deg, #09131d 0%, #0f2030 55%, #101827 100%);
        color: #effaff;
      }
      main {
        max-width: 720px;
        margin: 48px auto;
        padding: 32px;
        border-radius: 24px;
        background: rgba(8, 16, 27, 0.8);
        border: 1px solid rgba(43, 197, 255, 0.22);
      }
      input,
      button {
        width: 100%;
        border-radius: 16px;
        border: 1px solid rgba(70, 208, 255, 0.22);
        background: rgba(9, 18, 29, 0.92);
        color: #f7ffff;
        padding: 16px;
        box-sizing: border-box;
        margin-top: 16px;
      }
      .row {
        display: grid;
        gap: 16px;
        grid-template-columns: 1fr 1fr;
      }
      button {
        margin-top: 28px;
        background: linear-gradient(90deg, #47f0c2 0%, #2cc8ff 100%);
        color: #041019;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>CSP Checkout Sandbox</h1>
      <p>This page uses a strict CSP and strong payment markers to validate main-world relay injection safely.</p>
      <form data-payment-form action="/payment/confirm" method="post">
        <div data-payment-element></div>
        <input autocomplete="cc-number" inputmode="numeric" placeholder="0000 0000 0000 0000">
        <div class="row">
          <input autocomplete="cc-exp" placeholder="08/29">
          <input autocomplete="cc-csc" placeholder="000">
        </div>
        <button type="submit">Pay now</button>
      </form>
    </main>
  </body>
</html>
